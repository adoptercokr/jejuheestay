<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 모던 럭셔리 다크 배경 (어두운 탭, 밝은 탭 모두에서 돋보이는 딥 차콜 & 둥근 모서리) -->
  <rect width="64" height="64" rx="14" fill="#1C1917"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FAF8F5" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- 선명한 화이트 세리프 영문 'H' (우아하고 뚜렷한 실루엣) -->
  <text x="32" y="44" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="34" 
        font-weight="700" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="0">H</text>

  <!-- 한글 '희' (따뜻한 골드 앰버 톤 악센트 뱃지, H 중심에 감성적으로 융합) -->
  <circle cx="45" cy="19" r="10" fill="#D97706"/>
  <text x="45" y="23" 
        font-family="'Pretendard', 'Noto Serif KR', sans-serif" 
        font-size="11" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle">희</text>
</svg>
